name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_soak:
        description: Run the two-hour sustained-use check on a hosted Mac
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source, tests, and build
        run: npm run verify

      - name: Smoke-test the Electron interface
        run: npm run smoke:electron:full

      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Grokky-accessibility-${{ matrix.os }}
          path: output/accessibility/**/*.json
          if-no-files-found: warn
          retention-days: 14

  sandbox:
    name: Verify Cloudflare computer gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/sandbox-gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/sandbox-gateway/package-lock.json

      - name: Install gateway dependencies
        run: npm ci

      - name: Verify Worker, tests, and deployment bundle
        run: npm run verify

      - name: Install browser for phone interaction checks
        run: npx playwright install --with-deps chromium webkit

      - name: Verify phone interactions and compact layouts
        run: npm run smoke:phone-ui

      - name: Verify phone interactions with WebKit
        run: npm run smoke:phone-ui
        env:
          GROKKY_PHONE_BROWSER: webkit

  soak:
    name: Two-hour sustained use (hosted Mac)
    if: github.event_name == 'workflow_dispatch' && inputs.run_soak
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Exercise sustained UI and persistence
        run: npm run smoke:soak
      - name: Upload sustained-use report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Grokky-sustained-use
          path: output/soak/*.json
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    needs: [verify, sandbox]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-14
            command: npm run package:mac
            check: npm run verify:package:mac
            artifact: release/*.dmg
          - name: Windows-x64
            os: windows-2022
            command: npm run package:win
            check: npm run verify:package:win
            artifact: release/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: ${{ matrix.command }}

      - name: Verify packaged Codex runtime
        run: ${{ matrix.check }}

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Grokky-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
